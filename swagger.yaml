openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: A simple API to create, view, list, update, and delete todos.

servers:
  - url: http://localhost:8080

paths:
  /todos:
    post:
      summary: Create a todo
      description: Create a todo with a name. Status is optional and defaults to pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Finish Go assignment
                status:
                  type: string
                  enum: [pending, in_progress, completed]
                  default: pending
                  example: pending
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid input, such as a missing name or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: List todos
      description: Return todos in pages. Use the next_cursor value to request the next page.
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of todos to return. Maximum is 50.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          description: Cursor returned by the previous list response.
          schema:
            type: string
      responses:
        '200':
          description: Todos returned successfully. The list may be empty.
          content:
            application/json:
              schema:
                type: object
                required: [todos, next_cursor]
                properties:
                  todos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
                  next_cursor:
                    type: string
                    nullable: true
        '400':
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the todo
        schema:
          type: integer
          minimum: 1

    get:
      summary: Get a todo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid todo ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update a todo
      description: Update the todo name and status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status]
              properties:
                name:
                  type: string
                  example: Finish Go assignment
                status:
                  type: string
                  enum: [pending, in_progress, completed]
                  example: completed
      responses:
        '200':
          description: Todo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a todo
      responses:
        '204':
          description: Todo deleted successfully
        '400':
          description: Invalid todo ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Todo:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Finish Go assignment
        status:
          type: string
          enum: [pending, in_progress, completed]
          example: pending
        created_at:
          type: string
          format: date-time
          example: '2026-10-15T09:30:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-15T09:30:00Z'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Todo not found
